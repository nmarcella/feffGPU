# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # the version comes from git (setuptools-scm): fetch the whole history and the tags
      - git fetch --unshallow --tags || true
    pre_install:
      - python -m pip install --upgrade pip
      # Read the Docs has no GPU: install the small CPU-only PyTorch first, so that `pip install .` does not pull the CUDA
      # build. PyPI stays available for PyTorch's own dependencies.
      - python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
